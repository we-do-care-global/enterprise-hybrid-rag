name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install --break-system-packages -r requirements.lock
          pip install --break-system-packages pytest pytest-asyncio pytest-cov ruff mypy bandit safety pbr
      - name: Lint
        run: ruff check app/ eval/
      - name: Typecheck
        run: mypy app/ eval/ --ignore-missing-imports
      - name: Security scan (bandit)
        run: bandit -r app/ eval/ -f json -o bandit-report.json
      - name: Security scan (safety)
        run: pip install --break-system-packages safety==2.3.5 && safety check --json --output safety-report.json
      - name: Test with coverage
        run: python -m pytest -v --cov=app --cov=eval --cov-report=xml --cov-fail-under=80

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: enterprise-hybrid-rag:test
          load: true